<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Coach"><title>Coach</title>
<link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#06231c"><style>
#sp{display:none;flex-direction:column;align-items:center;gap:18px}#sp img{width:84px;height:84px;border-radius:20px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
#sp i{display:block;width:120px;height:3px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
#sp i:after{content:"";position:absolute;inset:0;width:40%;border-radius:9px;background:#7fd4ad;animation:ld 1.1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
#pill{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;padding:11px 18px;border-radius:999px;background:rgba(8,36,28,.94);color:#eef5f1;border:1px solid rgba(127,212,173,.5);font:500 14px -apple-system,Inter,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#pill.off{border-color:rgba(255,255,255,.2);cursor:default;font-size:12.5px;opacity:.9}
body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#0f3a2e 0%,transparent 60%),#06231c;color:#eef5f1;font:16px -apple-system,Inter,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
form{width:min(320px,90vw);text-align:center}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#eef5f1;font-size:17px;margin-top:10px}
button{background:#7fd4ad;color:#06231c;border:0;font-weight:600}#m{color:#ff5c6c;min-height:22px;margin-top:10px;font-size:14px}h1{font-size:22px;margin:0 0 6px}p{color:#8b93a7;font-size:14px;margin:0}</style></head>
<body><div id="sp"><img src="icon.png" alt=""><p>Lade deinen Tag …</p><i></i></div><form id="f"><h1>Trainings-Cockpit</h1><p>Passwort eingeben</p><input id="p" type="password" placeholder="Passwort" autocomplete="current-password"><button>Öffnen</button><div id="m"></div></form>
<script>
const P={"s": "FqmOFzAztYeKpt+IyDZRHQ==", "i": 200000, "u": {"n": "9nhXN4pKADlKdTfekYbEYw==", "t": "zZenLLZ3BYTgiWlk0xw1BPwoe2cJTbPgrlHBYAiTOkc=", "c": "17ZO6kLcd/yApWX5e1rgGnpWpjAt9MwJ666XrNL8FCnvUxWQj+qj/nfGQ6XLjkRl4QCcfVqlBcIw3BgerHD93DtkmZmAm2Rt1j/V/UhHZcGuuA=="}};const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const KEY='coachKey2';let BASE='',STAND='';
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b(P.s),iterations:P.i,hash:'SHA-256'},k,512))}
async function dec(raw,E){const ek=await crypto.subtle.importKey('raw',raw.slice(0,32),{name:'HMAC',hash:'SHA-256'},false,['sign']);
 const mk=await crypto.subtle.importKey('raw',raw.slice(32),{name:'HMAC',hash:'SHA-256'},false,['sign']);
 const n=b(E.n),c=b(E.c);const mac=new Uint8Array(n.length+c.length);mac.set(n);mac.set(c,n.length);
 const tag=new Uint8Array(await crypto.subtle.sign('HMAC',mk,mac));const t=b(E.t);if(tag.length!==t.length||tag.some((x,i)=>x!==t[i]))throw 0;
 const out=new Uint8Array(c.length);const N=Math.ceil(c.length/32);
 for(let s=0;s<N;s+=4096){await Promise.all(Array.from({length:Math.min(4096,N-s)},async(_,j)=>{const i=s+j;const m=new Uint8Array(20);m.set(n);new DataView(m.buffer).setUint32(16,i);
   const ks=new Uint8Array(await crypto.subtle.sign('HMAC',ek,m));for(let x=0;x<32&&i*32+x<c.length;x++)out[i*32+x]=c[i*32+x]^ks[x]}))}
 return out}
async function open_(raw){BASE=new TextDecoder().decode(await dec(raw,P.u));
 const r=await fetch(BASE+'dash.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('net');const E=await r.json();STAND=E.stand||'';
 const out=await dec(raw,E);
 const html=await new Response(new Blob([out]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 const f=document.createElement('iframe');f.setAttribute('srcdoc',html);f.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#06231c';
 document.body.innerHTML='';document.body.style.display='block';document.body.appendChild(f);setTimeout(chk,800)}
async function go(raw,save){try{await open_(raw);if(save)try{localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)))}catch(e){}}catch(e){
 document.getElementById('sp').style.display='none';document.getElementById('f').style.display='';
 if(e&&e.message==='net'){document.getElementById('m').textContent='Keine Verbindung – bitte erneut versuchen';return}
 try{localStorage.removeItem(KEY)}catch(_){}document.getElementById('m').textContent=save?'Falsches Passwort':'';}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();document.getElementById('m').textContent='Entschlüssele …';go(await derive(document.getElementById('p').value),true)};
let st=null;try{st=localStorage.getItem(KEY)}catch(e){}
if(st){document.getElementById('f').style.display='none';document.getElementById('sp').style.display='flex';go(b(st),false)}
function pill(t,fn,off){let p=document.getElementById('pill');if(!t){if(p)p.remove();return}if(!p){p=document.createElement('div');p.id='pill';document.body.appendChild(p)}p.textContent=t;p.className=off?'off':'';p.onclick=fn||null}
async function chk(){if(!BASE)return;if(!navigator.onLine){pill('Offline · Stand '+STAND,null,true);return}
 try{const r=await fetch(BASE+'stand.txt?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const t=(await r.text()).trim();
  if(t&&STAND&&t!==STAND)pill('Neue Daten von '+t.slice(-5)+' · tippen zum Laden',()=>location.reload());else pill(null)}catch(e){}}
setInterval(chk,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});addEventListener('online',chk);addEventListener('offline',chk);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
